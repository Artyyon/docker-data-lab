services:
  postgres:
    image: postgres:15
    container_name: postgres_estudo
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: estudo_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rede_estudo

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_estudo
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - rede_estudo

volumes:
  postgres_data:
  pgadmin_data:

networks:
  rede_estudo:
    external: true